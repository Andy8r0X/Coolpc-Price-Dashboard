<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>原價屋價格儀表板</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <!-- 在頁面載入前先套用主題，避免閃爍 -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const theme = saved || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="brand">🖥️ 原價屋價格儀表板</div>
    <div class="header-right">
      <div class="meta" id="meta">載入中…</div>
      <button id="themeToggle" class="theme-toggle" title="切換深色/淺色">🌙</button>
    </div>
  </header>

  <main class="container">
    <!-- 以下不變 -->
    <section class="stats" id="stats"></section>

    <section class="filter-bar">
      <input id="search" type="text" placeholder="搜尋商品名稱…" />
      <select id="category">
        <option value="">全部分類</option>
      </select>
      <select id="sort">
        <option value="changeDesc">漲幅最多</option>
        <option value="changeAsc">跌幅最多</option>
        <option value="priceDesc">價格高→低</option>
        <option value="priceAsc">價格低→高</option>
        <option value="name">名稱</option>
      </select>
      <label class="check"><input type="checkbox" id="onlyChanged" /> 只看價格異動</label>
      <label class="check"><input type="checkbox" id="onlyHot" /> 只看熱賣</label>
    </section>

    <section class="grid" id="grid"></section>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">✕</button>
      <h2 id="modalTitle"></h2>
      <p class="modal-sub" id="modalSub"></p>
      <div class="modal-price" id="modalPrice"></div>
      <div id="chart" style="height: 360px;"></div>
    </div>
  </div>

  <footer class="site-footer">
    資料來源：原價屋估價系統（僅供參考，非官方）。自動更新。
  </footer>

  <script src="./app.js"></script>
</body>
</html>
